<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jatin Suyal | Unity &amp; XR Developer</title>
<meta name="description" content="Unity developer creating immersive games, XR experiences, and interactive 3D applications.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080d13;--text:#f2f7fb;--muted:#d1dbe2;--accent:#39e5f2}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,Arial,sans-serif;overflow-x:hidden}a{color:inherit;text-decoration:none}
.hero{height:calc(100vh + 16320px);position:relative}.stage{height:100vh;height:100dvh;position:sticky;top:0;overflow:hidden;background:var(--bg);isolation:isolate}
#frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;opacity:0}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(4,8,12,.86) 0%,rgba(4,8,12,.57) 28%,rgba(4,8,12,.08) 68%,rgba(4,8,12,.02) 100%),linear-gradient(0deg,rgba(4,8,12,.28),transparent 28%,transparent 75%,rgba(4,8,12,.22))}
.top{position:absolute;z-index:3;top:0;left:0;right:0;padding:24px 6vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.13);font-size:12px;letter-spacing:.12em}.brand{font-family:'Space Grotesk',sans-serif;font-weight:800;color:var(--accent)}.nav{display:flex;gap:22px;align-items:center;font-size:10px;letter-spacing:.12em;color:#d3dee6}.nav a:hover{color:var(--accent)}
.intro{position:absolute;z-index:3;left:8vw;top:50%;transform:translateY(-45%);max-width:570px}.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#d2e0e8;margin:0 0 22px}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(48px,7.4vw,100px);line-height:.92;letter-spacing:-.065em;margin:0 0 24px;font-weight:800}h1 span{color:var(--accent)}.intro p{max-width:410px;font-size:15px;line-height:1.7;color:var(--muted);margin:0}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.button{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border:1px solid rgba(255,255,255,.25);font-size:10px;font-weight:700;letter-spacing:.12em;transition:transform .2s,border-color .2s,background .2s}.button.primary{background:var(--accent);border-color:var(--accent);color:#071116}.button:hover{transform:translateY(-2px);border-color:var(--accent)}
.bottom{position:absolute;z-index:3;left:6vw;right:6vw;bottom:26px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:#d4dfe7;font-size:10px;letter-spacing:.13em;text-transform:uppercase}.progress{height:2px;background:rgba(255,255,255,.25);position:absolute;z-index:4;bottom:0;left:0;right:0}.progress span{display:block;width:0;height:100%;background:var(--accent)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#b8c7d1;font-size:12px;letter-spacing:.12em;text-transform:uppercase;z-index:1}
@media(max-width:700px){.top{padding:20px 6vw}.nav{gap:12px;font-size:8px}.intro{left:7vw;right:7vw;top:48%}h1{font-size:clamp(48px,13vw,78px)}.intro p{font-size:13px;max-width:310px}.bottom{left:7vw;right:7vw;bottom:20px;font-size:8px}.shade{background:linear-gradient(90deg,rgba(4,8,12,.82),rgba(4,8,12,.3)),linear-gradient(0deg,rgba(4,8,12,.4),transparent 45%)}.button{padding:12px 13px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
<section class="hero" id="home" aria-label="Jatin Suyal portfolio introduction">
 <div class="stage">
  <div class="loading" id="loading">Loading motion sequence…</div>
  <img id="frame" alt="Animated product render sequence">
  <div class="shade"></div>
  <header class="top"><a class="brand" href="index.html">JATIN SUYAL</a><nav class="nav"><a href="projects.html">DOSSIER ↗</a><a href="https://github.com/jatinsuyal" target="_blank" rel="noreferrer">GITHUB ↗</a><a href="https://www.linkedin.com/in/jatin-suyal-855333173/" target="_blank" rel="noreferrer">LINKEDIN ↗</a></nav></header>
  <div class="intro">
   <p class="kicker">Unity Developer · XR &amp; Interactive Experiences</p>
   <h1>Building<br>worlds<span>.</span><br>Beyond<br>the screen.</h1>
   <p>I create immersive experiences, games, and interactive 3D applications.</p>
   <div class="actions"><a class="button primary" href="projects.html">PROJECT DOSSIER ↗</a><a class="button" href="contact.html">GET IN TOUCH</a></div>
  </div>
  <div class="bottom"><span>Scroll to explore</span><span id="frameCount">001 / 408</span></div>
  <div class="progress"><span id="progress"></span></div>
 </div>
</section>
</main>
<script>
(()=>{
 const frame=document.getElementById('frame'),loading=document.getElementById('loading'),countLabel=document.getElementById('frameCount'),progressBar=document.getElementById('progress');
 const total=408,base='https://raw.githubusercontent.com/jatinsuyal/jatinsuyal.github.io/main/FrameRenders/';
 const frames=new Array(total);let desired=0,shown=-1,scheduled=false,nextToLoad=0,activeLoads=0,loaded=0;const concurrency=8;
 function pump(){while(activeLoads<concurrency&&nextToLoad<total){const i=nextToLoad++,im=new Image();frames[i]=im;activeLoads++;im.onload=()=>{activeLoads--;loaded++;if(i===0){frame.src=im.src;frame.style.opacity='1';loading.style.display='none'}if(i===desired)paint();if(loaded===total)loading.style.display='none';pump()};im.onerror=()=>{activeLoads--;pump()};im.src=base+'frame_'+String(i).padStart(6,'0')+'.webp'}}
 function paint(){let i=desired;if(!frames[i]||!frames[i].complete||!frames[i].naturalWidth){let found=-1;for(let d=1;d<total;d++){const a=desired-d,b=desired+d;if(a>=0&&frames[a]?.complete&&frames[a]?.naturalWidth){found=a;break}if(b<total&&frames[b]?.complete&&frames[b]?.naturalWidth){found=b;break}}if(found<0)return;i=found}shown=i;if(frame.src!==frames[i].src)frame.src=frames[i].src;countLabel.textContent=String(i+1).padStart(3,'0')+' / '+total}
 function update(){const hero=document.querySelector('.hero'),range=Math.max(1,hero.offsetHeight-innerHeight),p=Math.max(0,Math.min(1,-hero.getBoundingClientRect().top/range));desired=Math.round(p*(total-1));progressBar.style.width=(p*100)+'%';if(desired!==shown)paint();scheduled=false}
 function onScroll(){if(!scheduled){scheduled=true;requestAnimationFrame(update)}}window.addEventListener('scroll',onScroll,{passive:true});window.addEventListener('resize',onScroll);pump();update()
})();
</script>
</body>
</html>
